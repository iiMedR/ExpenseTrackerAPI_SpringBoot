services:
  postgres:
    image: postgres:17
    container_name: expenseTracker_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - "expenseTracker-postgres-data:/var/lib/postgresql/data"

volumes:
  expenseTracker-postgres-data: